<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#070b18">
<title>Crew Catch</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#070b18;color:#eaf0ff;font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:12px;padding:14px 18px;font-weight:700;font-size:17px;z-index:2;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.5)}
  #over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:rgba(7,11,24,.82);z-index:3;text-align:center}
  #over.on{display:flex}
  #over h1{font-size:clamp(36px,9vw,64px);background:linear-gradient(100deg,#36d1ff,#fff 45%,#ff4fa3 80%,#ffd24a);-webkit-background-clip:text;background-clip:text;color:transparent}
  #over p{color:#95a3c7;font-size:16px;line-height:1.5;max-width:420px}
  button{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:999px;padding:14px 32px;cursor:pointer;color:#07101f;background:linear-gradient(95deg,#36d1ff,#9ef0ff);box-shadow:0 12px 28px rgba(54,209,255,.3)}
  a{color:#36d1ff;font-size:14px;text-decoration:none}
</style>
</head>
<body>
<div id="hud"><span id="score">Caught 0</span><span id="lives"></span></div>
<canvas id="c"></canvas>
<div id="over">
  <h1 id="otitle">Crew Catch</h1>
  <p id="osub">Catch the crew as they fall. Miss one and you lose a life. Joe is trouble, so don't catch him!</p>
  <button id="go">Play</button>
  <a href="../../index.html">← Back to the hub</a>
</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const overEl = document.getElementById('over');
const goBtn = document.getElementById('go');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');

const SZ = 56, BW = 120, BH = 22, BASKET_GAP = 70;
const SRC = {
  amaan: '../amaan/amaan.jpg',
  samuel: '../connectsamuel/samuel.png',
  haider: '../angryhaider/haider.png',
  zach: '../angryhaider/zach.png',
  josh: '../stackjosh/josh.png',
  ariyan: '../snariyan/ariyan.png',
  charlie: '../paccymatt/charlie.png',
  austin: '../kickaustin/austin.png',
  joe: '../wackjoe/joe.jpeg'
};
const GOOD = ['amaan', 'samuel', 'haider', 'zach', 'josh', 'ariyan', 'charlie', 'austin'];
const imgs = {};
for (const k in SRC) { imgs[k] = new Image(); imgs[k].src = SRC[k]; }

let dpr = 1, state = 'menu', score = 0, lives = 3, items = [], spawnT = 0, bx = 0, last = 0;
let best = 0;
try { best = Number(localStorage.getItem('crewcatch-best')) || 0; } catch (e) {}
const keys = {};

function resize() {
  dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr;
  cv.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bx = Math.min(Math.max(bx, BW / 2), innerWidth - BW / 2) || innerWidth / 2;
}
addEventListener('resize', resize);
resize();

function setHud() {
  scoreEl.textContent = 'Caught ' + score + ' · Best ' + best;
  livesEl.textContent = lives > 0 ? '❤️'.repeat(lives) : '💀';
}

function reset() {
  score = 0; lives = 3; items = []; spawnT = 0;
  bx = innerWidth / 2;
  setHud();
}

function speed() { return Math.min(420, 120 + score * 6); }

function spawn() {
  const bad = Math.random() < 0.18;
  const k = bad ? 'joe' : GOOD[Math.floor(Math.random() * GOOD.length)];
  items.push({ k: k, bad: bad, x: SZ / 2 + 10 + Math.random() * (innerWidth - SZ - 20), y: -SZ, v: speed() * (0.8 + Math.random() * 0.5) });
}

function endGame() {
  state = 'over';
  if (score > best) {
    best = score;
    try { localStorage.setItem('crewcatch-best', String(best)); } catch (e) {}
  }
  setHud();
  document.getElementById('otitle').textContent = 'Game over';
  document.getElementById('osub').textContent = 'You caught ' + score + '. Best: ' + best + '. Can the crew do better?';
  goBtn.textContent = 'Play again';
  overEl.classList.add('on');
}

function update(dt) {
  if (keys['ArrowLeft']) bx -= 500 * dt;
  if (keys['ArrowRight']) bx += 500 * dt;
  bx = Math.min(Math.max(bx, BW / 2), innerWidth - BW / 2);

  spawnT -= dt;
  if (spawnT <= 0) {
    spawn();
    spawnT = Math.max(0.35, 0.9 - score * 0.02) * (0.7 + Math.random() * 0.6);
  }

  const basketY = innerHeight - BASKET_GAP;
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.v * dt;
    const cy = it.y + SZ / 2;

    if (cy >= basketY && cy <= basketY + 40 && Math.abs(it.x - bx) < BW / 2 + SZ / 4) {
      items.splice(i, 1);
      if (it.bad) { lives--; } else { score++; }
      setHud();
      if (lives <= 0) { endGame(); return; }
      continue;
    }

    if (it.y > innerHeight + SZ) {
      items.splice(i, 1);
      if (!it.bad) { lives--; setHud(); if (lives <= 0) { endGame(); return; } }
    }
  }
}

function draw() {
  const w = innerWidth, h = innerHeight;
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#0b1230');
  g.addColorStop(1, '#2a1447');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  for (const it of items) {
    const img = imgs[it.k];
    ctx.save();
    ctx.beginPath();
    ctx.arc(it.x, it.y + SZ / 2, SZ / 2, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    if (img.complete && img.naturalWidth) {
      ctx.drawImage(img, it.x - SZ / 2, it.y, SZ, SZ);
    } else {
      ctx.fillStyle = it.bad ? '#ff3d3d' : '#36d1ff';
      ctx.fillRect(it.x - SZ / 2, it.y, SZ, SZ);
    }
    ctx.restore();
    ctx.lineWidth = 3;
    ctx.strokeStyle = it.bad ? '#ff3d3d' : '#ffffff';
    ctx.beginPath();
    ctx.arc(it.x, it.y + SZ / 2, SZ / 2, 0, Math.PI * 2);
    ctx.stroke();
  }

  const by = innerHeight - BASKET_GAP;
  ctx.fillStyle = '#ffd24a';
  ctx.fillRect(bx - BW / 2, by, BW, BH);
  ctx.fillStyle = '#ffb347';
  ctx.fillRect(bx - BW / 2, by + BH - 6, BW, 6);
}

function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0);
  last = t;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(frame);
}

goBtn.onclick = function () {
  reset();
  state = 'play';
  overEl.classList.remove('on');
};

function pointerMove(e) {
  if (e.buttons || e.pointerType === 'touch') bx = e.clientX;
}
cv.addEventListener('pointerdown', function (e) { bx = e.clientX; });
cv.addEventListener('pointermove', pointerMove);

addEventListener('keydown', function (e) { keys[e.key] = true; });
addEventListener('keyup', function (e) { keys[e.key] = false; });

setHud();
requestAnimationFrame(frame);
</script>
</body>
</html>
